services:
  - type: web
    name: tariff-desk
    runtime: python
    plan: standard
    region: frankfurt
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: TINKER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
